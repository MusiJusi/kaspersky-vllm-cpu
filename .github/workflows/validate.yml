name: Validate CPU inference

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'results/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Free disk space on the disposable runner
        run: |
          # These preinstalled SDKs are unused by this Python/Docker job.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.12'
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Install pinned cluster tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/bin results
          curl -fsSL https://github.com/kubernetes/minikube/releases/download/v1.39.0/minikube-linux-amd64 -o .local/bin/minikube
          curl -fsSL https://github.com/kubernetes/minikube/releases/download/v1.39.0/minikube-linux-amd64.sha256 -o .local/bin/minikube.sha256
          printf '%s  %s\n' "$(cat .local/bin/minikube.sha256)" .local/bin/minikube | sha256sum --check
          curl -fsSL https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl -o .local/bin/kubectl
          curl -fsSL https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl.sha256 -o .local/bin/kubectl.sha256
          printf '%s  %s\n' "$(cat .local/bin/kubectl.sha256)" .local/bin/kubectl | sha256sum --check
          chmod +x .local/bin/minikube .local/bin/kubectl
          echo "$PWD/.local/bin" >> "$GITHUB_PATH"
      - name: Build rootless CPU images
        run: |
          docker build -t kaspersky-model-downloader:dev -f downloader/Dockerfile .
          docker build -t kaspersky-vllm-cpu:dev -f Dockerfile .
          docker run --rm --entrypoint python kaspersky-vllm-cpu:dev -c "import os,torch,importlib.metadata; assert os.getuid()==10001; assert torch.version.cuda is None; print(importlib.metadata.version('vllm')); print(torch.__version__)"
          docker builder prune --force
          df -h /
      - name: Create Minikube cluster and deploy
        run: |
          minikube start -p kaspersky-vllm-cpu --driver=docker --cpus=2 --memory=5200 --kubernetes-version=v1.37.0 --keep-context
          minikube image load -p kaspersky-vllm-cpu kaspersky-model-downloader:dev kaspersky-vllm-cpu:dev
          kubectl --context kaspersky-vllm-cpu apply -f k8s/base/namespace.yaml
          python -c "import secrets,pathlib; pathlib.Path('.local/api-token').write_text(secrets.token_urlsafe(32))"
          kubectl --context kaspersky-vllm-cpu -n llm-inference create secret generic vllm-secrets --from-file=api-token=.local/api-token --from-literal=hf-token=
          kubectl --context kaspersky-vllm-cpu apply -k k8s/overlays/ci
          python scripts/wait_ready.py
      - name: Endpoint, privacy, offline cache, benchmark and restart
        run: |
          python scripts/check_cluster.py --benchmark
          python - <<'PY'
          import json, os, platform, pathlib
          cpu = next((line.split(':', 1)[1].strip() for line in pathlib.Path('/proc/cpuinfo').read_text().splitlines() if line.startswith('model name')), platform.processor())
          metadata = {'commit': os.environ['GITHUB_SHA'], 'cpu': cpu, 'cluster_cpus': 2, 'cluster_memory_mib': 5200, 'dtype': 'float32', 'vllm': '0.27.1+cpu', 'python': platform.python_version(), 'inference': json.loads(pathlib.Path('k8s/overlays/ci/inference.json').read_text()), 'model': pathlib.Path('k8s/base/config/model.env').read_text()}
          pathlib.Path('results/environment.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
      - name: Collect cluster status
        if: always()
        run: |
          mkdir -p results
          kubectl --context kaspersky-vllm-cpu -n llm-inference get pods -o wide > results/pods.txt 2>&1 || true
          kubectl --context kaspersky-vllm-cpu -n llm-inference get events --sort-by=.lastTimestamp > results/events.txt 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cpu-validation-results
          path: results/
          retention-days: 7
